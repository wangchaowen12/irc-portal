<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRC Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #EDEEE9; --surface: #F7F5F1; --white: #FDFCFA;
  --deep: #2B4740; --mid: #4A6B5D; --accent: #A97860; --soft: #C9BDB6;
  --text: #2A2A27; --muted: #787870;
  --serif: 'Noto Serif TC', serif; --sans: 'Noto Sans TC', sans-serif;
}
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  font-weight: 300; line-height: 1.85; font-size: 16px; min-height: 100vh;
}

.demo-banner {
  background: var(--deep); color: rgba(255,255,255,0.85);
  font-size: 0.78rem; letter-spacing: 0.04em; text-align: center;
  padding: 0.6rem 1rem; line-height: 1.6;
}
.demo-banner strong { color: #fff; font-weight: 400; }

/* ── GATE ── */
#gate {
  min-height: calc(100vh - 44px);
  display: flex; align-items: center; justify-content: center;
  padding: 4rem 6vw;
}
.gate-box { max-width: 380px; width: 100%; text-align: center; }
.gate-kicker { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.4rem; }
.gate-title { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 300; color: var(--deep); line-height: 1.5; margin-bottom: 0.8rem; }
.gate-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 2.4rem; }
.gate-input {
  width: 100%; padding: 0.9rem 1.1rem; font-family: var(--sans);
  font-size: 0.95rem; text-align: center;
  background: var(--white); border: 1px solid rgba(43,71,64,0.18);
  border-radius: 2px; color: var(--text); margin-bottom: 0.9rem;
  outline: none; transition: border-color 0.2s;
}
.gate-input:focus { border-color: var(--accent); }
.gate-btn {
  width: 100%; padding: 0.9rem; background: var(--deep); color: #fff;
  border: none; border-radius: 2px; font-family: var(--sans);
  font-size: 0.88rem; letter-spacing: 0.08em; cursor: pointer;
  transition: background 0.2s;
}
.gate-btn:hover { background: var(--mid); }
.gate-btn:disabled { opacity: 0.5; cursor: default; }
.gate-msg { font-size: 0.82rem; color: var(--mid); margin-top: 0.9rem; min-height: 1.2em; line-height: 1.7; }
.gate-msg.error { color: var(--accent); }

/* ── CLASS PICKER ── */
#classPicker {
  display: none;
  min-height: calc(100vh - 44px);
  align-items: center; justify-content: center;
  padding: 4rem 6vw;
}
.picker-box { max-width: 420px; width: 100%; text-align: center; }
.picker-kicker { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.4rem; }
.picker-title { font-family: var(--serif); font-size: clamp(1.4rem, 3.6vw, 1.7rem); font-weight: 300; color: var(--deep); line-height: 1.5; margin-bottom: 0.8rem; }
.picker-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 2rem; }
.class-pick-btn {
  display: block; width: 100%; padding: 1rem 1.2rem; margin-bottom: 0.8rem;
  background: var(--white); border: 1px solid rgba(43,71,64,0.18); border-radius: 2px;
  font-family: var(--sans); font-size: 0.92rem; color: var(--text); text-align: left;
  cursor: pointer; transition: border-color 0.2s, transform 0.2s;
}
.class-pick-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

/* ── SPACE SHELL ── */
#space { display: none; }
.space-nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 6vw; background: rgba(237,238,233,0.92);
  backdrop-filter: blur(10px); border-bottom: 1px solid rgba(43,71,64,0.08);
}
.space-nav .logo { font-family: var(--serif); font-size: 0.9rem; color: var(--deep); letter-spacing: 0.1em; }
.space-nav .nav-actions { display: flex; align-items: center; gap: 1rem; }
.space-nav button {
  background: none; border: none; font-family: var(--sans); font-size: 0.78rem;
  color: var(--muted); cursor: pointer; letter-spacing: 0.04em;
}
.space-nav button:hover { color: var(--accent); }

/* ── HERO (from class page) ── */
.hero {
  background: var(--deep); color: #fff;
  padding: 8vh 6vw 6vh; position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(74,107,93,0.4) 0%, transparent 60%);
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; max-width: 760px; }
.eyebrow {
  display: inline-block; font-size: 0.78rem; letter-spacing: 0.28em;
  text-transform: uppercase; border: 1px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.7); padding: 5px 14px; border-radius: 2px;
  margin-bottom: 1.4rem;
}
.hero h1 {
  font-family: var(--serif); font-size: clamp(1.7rem, 3.6vw, 2.4rem);
  font-weight: 400; line-height: 1.4; margin-bottom: 0.9rem;
}
.hero .tagline { font-size: 0.98rem; color: rgba(255,255,255,0.72); max-width: 40em; }

/* ── INTRO (rendered from Firestore introHtml) ── */
.intro { background: var(--white); padding: 3.5rem 6vw; border-bottom: 1px solid rgba(43,71,64,0.08); }
.intro-inner { max-width: 760px; margin: 0 auto; }
.intro-inner p { font-size: 1rem; }
.intro-inner p + p { margin-top: 0.9rem; }
.intro-note {
  margin-top: 1.6rem; padding: 1rem 1.3rem; background: var(--surface);
  border-left: 3px solid var(--accent); font-size: 0.92rem; color: var(--muted); border-radius: 2px;
}

/* ── TOC ── */
.toc-section { padding: 2.5rem 6vw 0.5rem; max-width: 760px; margin: 0 auto; }
.toc-label { font-size: 0.78rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
.toc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
.toc-item {
  display: block; background: var(--white); border: 1px solid rgba(43,71,64,0.12);
  border-radius: 3px; padding: 0.7rem 0.9rem; text-decoration: none; color: var(--text);
  font-size: 0.88rem; transition: border-color 0.2s, transform 0.2s;
}
.toc-item:hover { border-color: var(--accent); transform: translateY(-1px); }
.toc-item .toc-num { color: var(--soft); font-family: var(--serif); font-size: 1rem; margin-right: 0.4rem; }

/* ── LESSONS (rendered from Firestore lessonsHtml) ── */
.lessons { max-width: 760px; margin: 0 auto; padding: 2rem 6vw 4rem; }
.lesson-block {
  background: var(--white); border: 1px solid rgba(43,71,64,0.1); border-radius: 4px;
  margin-bottom: 1.6rem; overflow: hidden; scroll-margin-top: 5rem;
}
.lesson-head { display: flex; align-items: baseline; gap: 0.9rem; padding: 1.6rem 1.8rem; border-bottom: 1px solid rgba(43,71,64,0.08); }
.lesson-num { font-family: var(--serif); font-size: 1.7rem; color: var(--soft); line-height: 1; }
.lesson-head h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; color: var(--deep); line-height: 1.5; }
.lesson-head .designer { display: block; font-family: var(--sans); font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }

details.practice { border-top: 1px solid rgba(43,71,64,0.06); }
details.practice summary {
  cursor: pointer; list-style: none; padding: 1rem 1.8rem;
  display: flex; align-items: center; gap: 0.6rem; font-size: 0.92rem;
  color: var(--mid); letter-spacing: 0.02em; user-select: none;
}
details.practice summary::-webkit-details-marker { display: none; }
details.practice summary .tag { font-size: 0.72rem; border: 1px solid rgba(74,107,93,0.35); border-radius: 1px; padding: 2px 8px; color: var(--mid); }
details.practice[open] summary .tag.pair { background: var(--mid); color: #fff; border-color: var(--mid); }
details.practice[open] summary .tag.life { background: var(--accent); color: #fff; border-color: var(--accent); }
summary .chevron { margin-left: auto; transition: transform 0.2s; color: var(--soft); font-size: 0.8rem; }
details.practice[open] summary .chevron { transform: rotate(90deg); }

.practice-body { padding: 0.2rem 1.8rem 1.6rem; font-size: 0.93rem; color: var(--text); }
.practice-body h4 { font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: var(--deep); margin: 1.1rem 0 0.5rem; }
.practice-body h4:first-child { margin-top: 0.3rem; }
.practice-body p { margin: 0.5rem 0; line-height: 1.8; }
.practice-body ol, .practice-body ul { margin: 0.5rem 0 0.8rem 1.3rem; }
.practice-body li { margin: 0.35rem 0; line-height: 1.75; }
.practice-body .sub-list { margin-top: 0.3rem; margin-bottom: 0.3rem; }
.practice-body strong { color: var(--deep); font-weight: 500; }
.practice-body .hr { border: none; border-top: 1px dashed rgba(43,71,64,0.15); margin: 1rem 0; }

/* ── ANNOUNCEMENTS / WALL ── */
.space-section { padding: 3.2rem 6vw; }
.space-section.alt { background: var(--surface); }
.space-section + .space-section { border-top: 1px solid rgba(43,71,64,0.06); }
.sec-label { font-size: 0.68rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; }
.sec-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 400; color: var(--deep); margin-bottom: 1.6rem; }
.announce-item { padding: 1rem 0; border-bottom: 1px solid rgba(43,71,64,0.08); font-size: 0.87rem; color: var(--muted); max-width: 640px; }
.announce-item:first-child { border-top: 1px solid rgba(43,71,64,0.08); }
.announce-item .a-date { font-size: 0.72rem; color: var(--accent); letter-spacing: 0.08em; display: block; margin-bottom: 0.3rem; }

.video-item {
  display: flex; gap: 1rem; align-items: flex-start;
  padding: 1rem 0; border-bottom: 1px solid rgba(43,71,64,0.08);
  max-width: 640px; text-decoration: none; color: inherit;
}
.video-item:first-child { border-top: 1px solid rgba(43,71,64,0.08); }
.video-item .v-play {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  background: var(--deep); color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 0.75rem; margin-top: 0.1rem;
}
.video-item .v-title { font-size: 0.92rem; color: var(--text); margin-bottom: 0.2rem; }
.video-item .v-date { font-size: 0.72rem; color: var(--soft); letter-spacing: 0.04em; }
.video-item:hover .v-title { color: var(--accent); }

.wall-box { max-width: 640px; }
.wall-input { display: flex; gap: 0.7rem; margin-bottom: 1.8rem; }
.wall-input textarea {
  flex: 1; resize: none; height: 56px; padding: 0.7rem 0.9rem;
  font-family: var(--sans); font-size: 0.87rem; border: 1px solid rgba(43,71,64,0.16);
  border-radius: 2px; background: var(--white); outline: none; color: var(--text);
}
.wall-input textarea:focus { border-color: var(--accent); }
.wall-input button { padding: 0 1.3rem; background: var(--deep); color: #fff; border: none; border-radius: 2px; font-family: var(--sans); font-size: 0.82rem; cursor: pointer; }
.wall-input button:hover { background: var(--mid); }
.wall-msg { padding: 0.9rem 0; border-bottom: 1px solid rgba(43,71,64,0.07); font-size: 0.86rem; }
.wall-msg .w-meta { font-size: 0.72rem; color: var(--soft); letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.wall-empty { font-size: 0.84rem; color: var(--soft); font-style: italic; }

/* ── CLOSING (optional, from Firestore closingText) ── */
.closing { background: var(--deep); color: rgba(255,255,255,0.9); text-align: center; padding: 4rem 6vw; }
.closing p { font-family: var(--serif); font-size: 1.15rem; line-height: 2; max-width: 32em; margin: 0 auto; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <p class="gate-kicker">IRC Space</p>
    <h1 class="gate-title" id="gateTitle">請輸入 Email 登入</h1>
    <p class="gate-sub" id="gateSub">我們會寄一封登入連結到你的信箱，點擊後即可進入。</p>
    <input type="email" id="emailInput" class="gate-input" placeholder="your@email.com" autocomplete="email">
    <button class="gate-btn" id="gateBtn" onclick="sendLoginLink()">寄送登入連結</button>
    <p class="gate-msg" id="gateMsg"></p>
  </div>
</div>

<div id="classPicker">
  <div class="picker-box">
    <p class="picker-kicker">IRC Space</p>
    <h1 class="picker-title">你同時屬於好幾個班級</h1>
    <p class="picker-sub">請選擇你這次想進入的空間，之後也可以隨時切換。</p>
    <div id="classPickerList"></div>
  </div>
</div>

<div id="space">
  <nav class="space-nav">
    <span class="logo">IRC Space</span>
    <div class="nav-actions">
      <button onclick="switchClass()" id="switchClassBtn" style="display:none;">切換班級</button>
      <button onclick="logout()">← 登出</button>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-inner">
      <span class="eyebrow" id="spaceCohort">—</span>
      <h1 id="spaceClassName">—</h1>
      <p class="tagline" id="spaceWelcome">—</p>
    </div>
  </div>

  <div class="intro">
    <div class="intro-inner" id="introArea">
      <p class="wall-empty">尚未提供課程介紹內容。</p>
    </div>
  </div>

  <div class="toc-section" id="tocSection" style="display:none;">
    <p class="toc-label">Course Journey</p>
    <div class="toc-grid" id="tocGrid"></div>
  </div>

  <div class="lessons" id="lessonsArea">
    <p class="wall-empty">尚未提供練習內容。</p>
  </div>

  <div class="space-section">
    <p class="sec-label">Latest</p>
    <h2 class="sec-title">最新消息</h2>
    <div id="announceList"></div>
  </div>

  <div class="space-section">
    <p class="sec-label">Practice Wall</p>
    <h2 class="sec-title">同班留言</h2>
    <div class="wall-box">
      <div class="wall-input">
        <textarea id="wallText" placeholder="留下這週練習後的感覺或想法…"></textarea>
        <button onclick="postMsg()">送出</button>
      </div>
      <div id="wallList"></div>
    </div>
  </div>

  <div class="closing" id="closingArea" style="display:none;">
    <p id="closingText"></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, sendSignInLinkToEmail, isSignInWithEmailLink,
  signInWithEmailLink, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, addDoc,
  query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSChAPNQX5fNv8kudpxDzq7m0OSuaWIrI",
  authDomain: "irc-space.firebaseapp.com",
  projectId: "irc-space",
  storageBucket: "irc-space.firebasestorage.app",
  messagingSenderId: "814017165127",
  appId: "1:814017165127:web:d7266a3d51cf7c2db87e62"
};

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

const actionCodeSettings = {
  url: window.location.href.split('?')[0],
  handleCodeInApp: true
};

window.sendLoginLink = async function () {
  const email = document.getElementById('emailInput').value.trim();
  const msg = document.getElementById('gateMsg');
  const btn = document.getElementById('gateBtn');
  if (!email) { msg.textContent = '請輸入 Email。'; msg.className = 'gate-msg error'; return; }
  btn.disabled = true;
  try {
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);
    window.localStorage.setItem('irc_email_for_signin', email);
    msg.textContent = `登入連結已寄到 ${email}，請到信箱點擊連結完成登入。`;
    msg.className = 'gate-msg';
  } catch (e) {
    msg.textContent = '寄送失敗：' + e.message;
    msg.className = 'gate-msg error';
    btn.disabled = false;
  }
};

window.logout = function () { signOut(auth); };

async function completeSignInIfNeeded() {
  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = window.localStorage.getItem('irc_email_for_signin');
    if (!email) { email = window.prompt('請再輸入一次你的 Email 以完成登入'); }
    try {
      await signInWithEmailLink(auth, email, window.location.href);
      window.localStorage.removeItem('irc_email_for_signin');
      window.history.replaceState({}, document.title, window.location.pathname);
    } catch (e) {
      document.getElementById('gateMsg').textContent = '登入連結無效或已過期，請重新申請。';
      document.getElementById('gateMsg').className = 'gate-msg error';
    }
  }
}
completeSignInIfNeeded();

let currentGroupCode = null;
let unsubWall = null;
let userGroupCodes = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('space').style.display = 'none';
    document.getElementById('classPicker').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateTitle').textContent = '請輸入 Email 登入';
    document.getElementById('gateSub').textContent = '我們會寄一封登入連結到你的信箱，點擊後即可進入。';
    if (unsubWall) { unsubWall(); unsubWall = null; }
    currentGroupCode = null;
    userGroupCodes = [];
    return;
  }

  let mapSnap;
  try {
    const mapRef = doc(db, 'participantGroups', user.email);
    mapSnap = await getDoc(mapRef);
  } catch (e) {
    console.error('讀取 participantGroups/' + user.email + ' 失敗：', e);
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('classPicker').style.display = 'none';
    document.getElementById('space').style.display = 'none';
    document.getElementById('gateTitle').textContent = '讀取班級資料失敗';
    document.getElementById('gateSub').textContent =
      `錯誤代碼：${e.code || e.message}。很可能是 Firestore 安全規則沒有開放讀取權限，請聯繫管理者確認。`;
    return;
  }

  if (!mapSnap.exists()) {
    showNotFound(user.email);
    return;
  }

  const data = mapSnap.data();
  // 相容舊資料：如果還是單一 groupCode 字串欄位，就包成陣列處理；
  // 新資料建議直接存 groupCodes 陣列，例如 ["CII_PLUS", "A4"]
  userGroupCodes = Array.isArray(data.groupCodes) && data.groupCodes.length
    ? data.groupCodes
    : (data.groupCode ? [data.groupCode] : []);

  if (!userGroupCodes.length) {
    showNotFound(user.email);
    return;
  }

  if (userGroupCodes.length === 1) {
    await enterClass(userGroupCodes[0]);
  } else {
    await showClassPicker();
  }
});

function showNotFound(email) {
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('classPicker').style.display = 'none';
  document.getElementById('space').style.display = 'none';
  document.getElementById('gateTitle').textContent = '尚未找到你的班級';
  document.getElementById('gateSub').textContent = `${email} 目前還沒被加入任何班級，請聯繫 IRC 確認。`;
}

async function showClassPicker() {
  if (unsubWall) { unsubWall(); unsubWall = null; }
  currentGroupCode = null;

  document.getElementById('gate').style.display = 'none';
  document.getElementById('space').style.display = 'none';
  document.getElementById('classPicker').style.display = 'flex';

  const listEl = document.getElementById('classPickerList');
  listEl.innerHTML = '<p class="wall-empty">載入班級中…</p>';

  const groups = [];
  const errors = [];
  for (const code of userGroupCodes) {
    try {
      const gSnap = await getDoc(doc(db, 'groups', code));
      if (gSnap.exists()) {
        groups.push({ code, ...gSnap.data() });
      } else {
        errors.push(`「${code}」這個班級在 groups 集合裡找不到對應文件`);
      }
    } catch (e) {
      console.error('讀取 groups/' + code + ' 失敗：', e);
      errors.push(`「${code}」讀取失敗：${e.code || e.message}`);
    }
  }

  if (!groups.length) {
    listEl.innerHTML = '<p class="wall-empty">' +
      (errors.length
        ? '無法載入班級資料：<br>' + errors.map(escapeHtml).join('<br>')
        : '找不到對應的班級資料，請聯繫 IRC 確認。') +
      '</p>';
    return;
  }

  if (errors.length) {
    console.warn('部分班級載入失敗：', errors);
  }

  listEl.innerHTML = '';
  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'class-pick-btn';
    btn.innerHTML = `<strong style="font-family:var(--serif);font-weight:400;">${g.name || g.code}</strong>` +
      (g.cohort ? `<br><span style="font-size:0.78rem;color:var(--muted);">${g.cohort}</span>` : '');
    btn.onclick = () => enterClass(g.code);
    listEl.appendChild(btn);
  });
}

window.switchClass = function () {
  if (userGroupCodes.length > 1) {
    showClassPicker();
  }
};

async function enterClass(groupCode) {
  currentGroupCode = groupCode;

  const groupRef = doc(db, 'groups', groupCode);
  const groupSnap = await getDoc(groupRef);
  if (!groupSnap.exists()) {
    // 選到的班級不存在了，退回選班畫面（或找不到頁面）
    if (userGroupCodes.length > 1) { showClassPicker(); } else { showNotFound(auth.currentUser.email); }
    return;
  }
  const cls = groupSnap.data();

  document.getElementById('gate').style.display = 'none';
  document.getElementById('classPicker').style.display = 'none';
  document.getElementById('space').style.display = 'block';

  document.getElementById('switchClassBtn').style.display = userGroupCodes.length > 1 ? 'inline' : 'none';

  document.getElementById('spaceCohort').textContent = cls.cohort || '';
  document.getElementById('spaceClassName').textContent = cls.name || '';
  document.getElementById('spaceWelcome').textContent = cls.tagline || `歡迎回來，${auth.currentUser.email}。`;

  // 課程介紹（HTML 內容，只有管理者能寫入這份文件，來源可信）
  document.getElementById('introArea').innerHTML = cls.introHtml
    || '<p class="wall-empty">尚未提供課程介紹內容。</p>';

  // 六堂課練習內容 + 自動產生目錄
  const lessonsArea = document.getElementById('lessonsArea');
  const tocSection = document.getElementById('tocSection');
  if (cls.lessonsHtml) {
    lessonsArea.innerHTML = cls.lessonsHtml;

    const blocks = lessonsArea.querySelectorAll('.lesson-block');
    if (blocks.length) {
      const tocGrid = document.getElementById('tocGrid');
      tocGrid.innerHTML = '';
      blocks.forEach((block, i) => {
        const id = block.id || ('lesson-' + (i + 1));
        block.id = id;
        const h2 = block.querySelector('h2');
        const title = h2 ? h2.childNodes[0].textContent.trim() : ('第 ' + (i + 1) + ' 堂');
        const a = document.createElement('a');
        a.className = 'toc-item';
        a.href = '#' + id;
        a.innerHTML = `<span class="toc-num">${i + 1}</span>${title}`;
        tocGrid.appendChild(a);
      });
      tocSection.style.display = 'block';
    } else {
      tocSection.style.display = 'none';
    }
  } else {
    lessonsArea.innerHTML = '<p class="wall-empty">尚未提供練習內容。</p>';
    tocSection.style.display = 'none';
  }

  // 結語（選填）
  const closingArea = document.getElementById('closingArea');
  if (cls.closingText) {
    document.getElementById('closingText').textContent = cls.closingText;
    closingArea.style.display = 'block';
  } else {
    closingArea.style.display = 'none';
  }

  // 老師分享的影片：改放在公開的 Members 頁面（不需登入即可看到），這裡不再重複顯示。

  const aList = document.getElementById('announceList');
  aList.innerHTML = (cls.announcements || []).map(a =>
    `<div class="announce-item"><span class="a-date">${a.date}</span>${a.text}</div>`
  ).join('') || '<p class="wall-empty">目前沒有新消息。</p>';

  if (unsubWall) unsubWall();
  const wallQ = query(collection(db, 'groups', currentGroupCode, 'wall'), orderBy('createdAt', 'desc'));
  unsubWall = onSnapshot(wallQ, (snap) => {
    const wList = document.getElementById('wallList');
    if (snap.empty) {
      wList.innerHTML = '<p class="wall-empty">還沒有人留言，第一個開始也很好。</p>';
      return;
    }
    wList.innerHTML = snap.docs.map(d => {
      const m = d.data();
      return `<div class="wall-msg"><div class="w-meta">${m.authorEmail}</div>${escapeHtml(m.text)}</div>`;
    }).join('');
  });
}

window.postMsg = async function () {
  const ta = document.getElementById('wallText');
  const text = ta.value.trim();
  if (!text || !currentGroupCode || !auth.currentUser) return;
  await addDoc(collection(db, 'groups', currentGroupCode, 'wall'), {
    text,
    authorEmail: auth.currentUser.email,
    createdAt: serverTimestamp()
  });
  ta.value = '';
};

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
