<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陪伴計時器｜語音引導 － IRC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #4E5580;
  --surface:    #454C74;
  --white:      #575E88;
  --deep:       #E8D98A;
  --mid:        #C9BC6E;
  --accent:     #E8895A;
  --soft:       #8B8FA8;
  --panel-dark: #2B2F52;
  --text:       #F3F1EA;
  --muted:      #ADB0C6;
  --serif:      'Noto Serif TC', serif;
  --sans:       'Noto Sans TC', sans-serif;
}

html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-weight: 300;
  line-height: 1.85;
  font-size: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.hero {
  padding: 6vh 8vw 3vh;
  background: var(--white);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.hero .kicker {
  font-size: 0.72rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 1.2rem;
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.5vw, 2.5rem);
  font-weight: 300; color: var(--deep);
  line-height: 1.45; margin-bottom: 1rem;
}
.hero p {
  font-size: 0.93rem; color: var(--muted); max-width: 34em; line-height: 2;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4rem 8vw;
}

.panel { width: 100%; max-width: 460px; text-align: center; }

/* ── SETUP ── */
.duration-row {
  display: flex; justify-content: center; gap: 0.8rem;
  margin: 2.2rem 0 2.6rem;
  flex-wrap: wrap;
}
.dur-btn {
  font-family: var(--serif);
  font-size: 1.05rem;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  padding: 0.9rem 1.7rem;
  cursor: pointer;
  transition: all 0.2s;
}
.dur-btn:hover { border-color: var(--mid); color: var(--text); }
.dur-btn.selected {
  background: var(--mid);
  border-color: var(--mid);
  color: var(--panel-dark);
}

.setup-label {
  font-size: 0.78rem; letter-spacing: 0.14em;
  color: var(--soft); text-transform: uppercase;
}

.primary-btn {
  font-family: var(--serif);
  font-size: 1.05rem;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 999px;
  padding: 1rem 2.6rem;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s;
}
.primary-btn:hover { background: var(--deep); color: var(--panel-dark); }
.primary-btn:disabled {
  opacity: 0.35; cursor: not-allowed;
}
.primary-btn:disabled:hover { background: var(--accent); color: #fff; }

.ghost-btn {
  font-family: var(--sans);
  font-size: 0.85rem;
  color: var(--soft);
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 999px;
  padding: 0.7rem 1.5rem;
  cursor: pointer;
  transition: all 0.2s;
}
.ghost-btn:hover { color: var(--text); border-color: var(--soft); }

/* ── RUNNING ── */
.ring-wrap {
  position: relative;
  width: 260px; height: 260px;
  margin: 0 auto 2.4rem;
  border-radius: 50%;
}
.ring-bg, .ring-progress {
  position: absolute; inset: 0;
  border-radius: 50%;
}
.ring-bg { background: var(--surface); }
.ring-progress {
  background: conic-gradient(var(--mid) calc(var(--pct, 0) * 1%), transparent 0);
  transition: background 0.3s linear;
}
.ring-inner {
  position: absolute; inset: 10px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.time-display {
  font-family: var(--serif);
  font-size: 2.6rem;
  color: var(--deep);
  font-weight: 300;
  letter-spacing: 0.02em;
}
.phase-label {
  margin-top: 0.4rem;
  font-size: 0.76rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--soft);
}

.control-row {
  display: flex; justify-content: center; gap: 0.9rem;
  margin-top: 1rem;
}

/* ── FINISHED ── */
.finish-msg {
  font-family: var(--serif);
  font-size: 1.3rem;
  color: var(--deep);
  margin-bottom: 2rem;
  line-height: 1.7;
}

.screen { display: none; }
.screen.active { display: block; }

footer {
  padding: 1.6rem 8vw 2.2rem;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  font-size: 0.78rem; color: var(--soft);
  border-top: 1px solid rgba(255,255,255,0.07);
}
footer a { color: var(--soft); text-decoration: none; }
footer a:hover { color: var(--accent); }

@media (max-width: 480px) {
  .ring-wrap { width: 220px; height: 220px; }
  .time-display { font-size: 2.2rem; }
}
</style>
</head>
<body>

<div class="hero">
  <p class="kicker">Guided Session Timer</p>
  <h1>🕰️ 陪伴計時器｜語音引導</h1>
  <p>選一段時間，安靜地陪自己或彼此待著。開始時、剩下最後五分鐘、以及時間結束時，都會有語音輕輕提醒，不用一直看時間。</p>
</div>

<main>
  <div class="panel">

    <!-- SETUP SCREEN -->
    <div class="screen active" id="screen-setup">
      <p class="setup-label">選擇這次的時間長度</p>
      <div class="duration-row" id="durationRow">
        <button type="button" class="dur-btn" data-min="10">10 分鐘</button>
        <button type="button" class="dur-btn" data-min="15">15 分鐘</button>
        <button type="button" class="dur-btn" data-min="20">20 分鐘</button>
      </div>
      <button type="button" class="primary-btn" id="startBtn" disabled>開始</button>
    </div>

    <!-- RUNNING SCREEN -->
    <div class="screen" id="screen-running">
      <div class="ring-wrap">
        <div class="ring-bg"></div>
        <div class="ring-progress" id="ringProgress"></div>
        <div class="ring-inner">
          <div class="time-display" id="timeDisplay">00:00</div>
          <div class="phase-label" id="phaseLabel">進行中</div>
        </div>
      </div>
      <div class="control-row">
        <button type="button" class="ghost-btn" id="pauseBtn">暫停</button>
        <button type="button" class="ghost-btn" id="endEarlyBtn">提前結束</button>
      </div>
    </div>

    <!-- FINISHED SCREEN -->
    <div class="screen" id="screen-finished">
      <p class="finish-msg">這段時間，先到這裡。</p>
      <button type="button" class="primary-btn" id="restartBtn">再開始一次</button>
    </div>

  </div>
</main>

<footer>
  <span>© IRC｜Inner Reality Circle</span>
  <span><a href="mailto:jowwen@mygrace.com.tw">jowwen@mygrace.com.tw</a></span>
</footer>

<audio id="audioStart" src="audio/start.m4a" preload="auto"></audio>
<audio id="audioWarning" src="audio/warning5.m4a" preload="auto"></audio>
<audio id="audioEnd" src="audio/end.m4a" preload="auto"></audio>

<script>
(function () {
  var durationRow = document.getElementById('durationRow');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var endEarlyBtn = document.getElementById('endEarlyBtn');
  var restartBtn = document.getElementById('restartBtn');

  var screenSetup = document.getElementById('screen-setup');
  var screenRunning = document.getElementById('screen-running');
  var screenFinished = document.getElementById('screen-finished');

  var timeDisplay = document.getElementById('timeDisplay');
  var phaseLabel = document.getElementById('phaseLabel');
  var ringProgress = document.getElementById('ringProgress');

  var audioStart = document.getElementById('audioStart');
  var audioWarning = document.getElementById('audioWarning');
  var audioEnd = document.getElementById('audioEnd');

  var WARNING_SECONDS = 5 * 60;

  var selectedMinutes = null;
  var totalSeconds = 0;
  var remainingAtPause = 0;
  var endAt = null;          // timestamp (ms) when the session should end
  var tickHandle = null;
  var warningFired = false;
  var endFired = false;
  var isPaused = false;

  function showScreen(el) {
    [screenSetup, screenRunning, screenFinished].forEach(function (s) {
      s.classList.remove('active');
    });
    el.classList.add('active');
  }

  function formatTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  // 讓之後（沒有使用者手勢觸發的）中場提醒、結束音檔，能在手機瀏覽器上自動播放，
  // 需要先在使用者這次點擊當下，讓瀏覽器「認得」這個音檔已經被允許播放過。
  // 這裡用「靜音播放再暫停」的方式解鎖，靜音是為了避免在手機上跟真正要播的
  // 「開始」音檔互搶音訊焦點，導致開始的聲音被蓋掉。
  function primeAudio(a) {
    var wasMuted = a.muted;
    a.muted = true;
    function cleanup() {
      a.pause();
      a.currentTime = 0;
      a.muted = wasMuted;
    }
    var p = a.play();
    if (p && p.then) {
      p.then(cleanup).catch(cleanup);
    } else {
      cleanup();
    }
  }

  durationRow.addEventListener('click', function (e) {
    var btn = e.target.closest('.dur-btn');
    if (!btn) return;
    Array.prototype.forEach.call(durationRow.querySelectorAll('.dur-btn'), function (b) {
      b.classList.remove('selected');
    });
    btn.classList.add('selected');
    selectedMinutes = parseInt(btn.getAttribute('data-min'), 10);
    startBtn.disabled = false;
  });

  startBtn.addEventListener('click', function () {
    if (!selectedMinutes) return;

    totalSeconds = selectedMinutes * 60;
    warningFired = false;
    endFired = false;
    isPaused = false;
    endAt = Date.now() + totalSeconds * 1000;

    // 開始音檔先播放，讓它先拿到音訊焦點
    audioStart.currentTime = 0;
    audioStart.play().catch(function () {});

    // 開始音檔播放之後，再靜音 prime 之後才會播放的兩個音檔（中場提醒、結束）
    primeAudio(audioWarning);
    primeAudio(audioEnd);

    showScreen(screenRunning);
    pauseBtn.textContent = '暫停';
    phaseLabel.textContent = '進行中';
    startTick();
  });

  function startTick() {
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(tick, 250);
    tick();
  }

  function tick() {
    if (isPaused) return;
    var remaining = (endAt - Date.now()) / 1000;

    if (remaining <= 0) {
      remaining = 0;
      finishSession();
    }

    timeDisplay.textContent = formatTime(remaining);
    var pct = totalSeconds > 0 ? ((totalSeconds - remaining) / totalSeconds) * 100 : 0;
    ringProgress.style.setProperty('--pct', pct.toFixed(2));

    if (!warningFired && totalSeconds > WARNING_SECONDS + 5 && remaining <= WARNING_SECONDS) {
      warningFired = true;
      phaseLabel.textContent = '最後五分鐘';
      audioWarning.currentTime = 0;
      audioWarning.play().catch(function () {});
    }
  }

  function finishSession() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    if (!endFired) {
      endFired = true;
      audioEnd.currentTime = 0;
      audioEnd.play().catch(function () {});
    }
    showScreen(screenFinished);
  }

  pauseBtn.addEventListener('click', function () {
    if (!isPaused) {
      isPaused = true;
      remainingAtPause = Math.max(0, (endAt - Date.now()) / 1000);
      pauseBtn.textContent = '繼續';
      phaseLabel.textContent = '已暫停';
      [audioStart, audioWarning, audioEnd].forEach(function (a) { a.pause(); });
    } else {
      isPaused = false;
      endAt = Date.now() + remainingAtPause * 1000;
      pauseBtn.textContent = '暫停';
      phaseLabel.textContent = warningFired ? '最後五分鐘' : '進行中';
    }
  });

  endEarlyBtn.addEventListener('click', function () {
    isPaused = false;
    endAt = Date.now();
    finishSession();
  });

  restartBtn.addEventListener('click', function () {
    selectedMinutes = null;
    startBtn.disabled = true;
    Array.prototype.forEach.call(durationRow.querySelectorAll('.dur-btn'), function (b) {
      b.classList.remove('selected');
    });
    showScreen(screenSetup);
  });
})();
</script>

</body>
</html>
