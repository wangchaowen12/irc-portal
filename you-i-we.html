<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You → I → We｜伴侶對話練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #211f28;
    --bg-deep: #14131c;
    --paper: #f4efe8;
    --ink: #ece6dc;
    --ink-dim: #b8b2ab;
    --you: #6c7fa8;
    --you-soft: #6c7fa833;
    --i: #c48a4a;
    --i-soft: #c48a4a33;
    --we: #a377a0;
    --we-soft: #a377a033;
    --line: #3a3742;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg-deep);
    color: var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding: 24px 16px;
  }
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:-1;
    opacity:0;
    transition: opacity 1.4s ease;
  }
  .serif{ font-family:'Noto Serif TC','Source Serif 4',serif; }

  #app{
    width:100%;
    max-width: 440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 28px;
  }

  .card{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 22px;
    animation: rise .5s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }

  h1.title{
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: .02em;
    text-align:center;
    line-height:1.5;
    margin:0;
  }
  p.lede{
    color: var(--ink-dim);
    text-align:center;
    line-height:1.9;
    font-size: .98rem;
    margin:0;
    max-width: 34ch;
  }

  .who-row{
    display:flex;
    gap:14px;
    width:100%;
  }
  .who-btn{
    flex:1;
    padding: 22px 0;
    font-size: 1.4rem;
    font-family:'Noto Serif TC',serif;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: #2a2732;
    color: var(--ink);
    cursor:pointer;
    transition: border-color .2s ease, transform .15s ease, background .2s ease;
  }
  .who-btn:hover{ border-color: var(--ink-dim); transform: translateY(-1px); }
  .who-btn:active{ transform: translateY(0); }

  .btn{
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #2a2732;
    color: var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    font-size: .98rem;
    letter-spacing:.02em;
    cursor:pointer;
    transition: border-color .2s ease, transform .15s ease, opacity .2s ease;
  }
  .btn:hover{ border-color: var(--ink-dim); }
  .btn:active{ transform: scale(.98); }
  .btn.primary{
    background: var(--ink);
    color: var(--bg-deep);
    border-color: var(--ink);
    font-weight:700;
  }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  .role-line{
    text-align:center;
    line-height:1.8;
  }
  .role-line .who{
    font-size: 1.05rem;
    color: var(--ink);
    font-weight:700;
  }
  .role-line .task{
    display:block;
    color: var(--ink-dim);
    font-size: .92rem;
    margin-top: 4px;
  }

  /* Timer ring */
  .ring-wrap{
    position:relative;
    width: 240px;
    height:240px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: var(--line); stroke-width:5; }
  .ring-fg{
    fill:none;
    stroke-width:5;
    stroke-linecap:round;
    transition: stroke-dashoffset 1s linear, stroke .4s ease;
  }
  .ring-center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .ring-time{
    font-size: 2.1rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .ring-label{
    font-size: .78rem;
    color: var(--ink-dim);
    letter-spacing:.05em;
  }
  .ring-wrap.pulse .ring-fg{
    animation: pulseGlow 1.1s ease-in-out 2;
  }
  @keyframes pulseGlow{
    0%,100%{ filter: drop-shadow(0 0 0px currentColor); }
    50%{ filter: drop-shadow(0 0 14px currentColor); }
  }

  .prompt-box{
    width:100%;
    background: #2a2732;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 22px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .prompt-box .example{
    font-family:'Noto Serif TC',serif;
    font-size: 1.05rem;
    line-height:1.8;
    color: var(--ink);
  }
  .prompt-box .example::before{ content:"「"; }
  .prompt-box .example::after{ content:"」"; }
  .sub-label{
    font-size:.82rem;
    color: var(--ink-dim);
    letter-spacing:.04em;
  }

  .need-block{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .need-item{
    background:#2a2732;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
  }
  .need-item .k{
    font-size:.8rem;
    color: var(--ink-dim);
    margin-bottom:6px;
  }
  .need-item .v{
    font-family:'Noto Serif TC',serif;
    font-size:1.05rem;
    line-height:1.7;
  }

  .dots{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--line);
    transition: all .3s ease;
  }
  .dot.active{
    width:22px;
    border-radius:5px;
  }

  .listen-note{
    font-size:.85rem;
    color: var(--ink-dim);
    text-align:center;
    line-height:1.8;
  }

  .tagline{
    font-size:.85rem;
    color: var(--ink-dim);
    letter-spacing:.06em;
    text-align:center;
    margin-top:-8px;
  }

  .hero{
    position:relative;
    width:100%;
    border-radius: 22px;
    overflow:hidden;
    aspect-ratio: 4 / 3;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter: saturate(.82) brightness(.78) contrast(1.03);
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(59,74,114,.28) 0%, rgba(20,19,28,.15) 40%, rgba(20,19,28,.92) 100%);
    mix-blend-mode: normal;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background: #3B4A72;
    mix-blend-mode: color;
    opacity:.35;
  }
  .hero-caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 22px 20px 20px;
    z-index:1;
  }
  .hero-caption h1{
    font-size: 1.5rem;
    font-weight: 500;
    line-height:1.5;
    margin:0;
    color: var(--ink);
    font-family:'Noto Serif TC','Source Serif 4',serif;
    text-shadow: 0 2px 14px rgba(0,0,0,.4);
  }

  .ptag{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:7px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }

  .setup-card{
    width:100%;
    background:#2a2732;
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .setup-row-label{
    font-size:.8rem;
    color: var(--ink-dim);
  }
  .name-input{
    width:100%;
    background:#211f28;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    color: var(--ink);
    font-family:'Noto Serif TC',serif;
    font-size:1.05rem;
    outline:none;
  }
  .name-input:focus{ border-color: var(--ink-dim); }
  .swatch-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .swatch{
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition: border-color .2s ease, transform .15s ease;
  }
  .swatch.selected{
    border-color: var(--ink);
    transform: scale(1.08);
  }

  footer.hint{
    color:#8a8490;
    font-size:.78rem;
    text-align:center;
  }
</style>
</head>

  const PALETTE = ['#8fa3c9','#c9a06a','#c97b8c'];

  const BG_TIERS = {
    you: { c:'#3B4A72', e:'#14131c' },
    i:   { c:'#8B8FA8', e:'#1e2130' },
    we:  { c:'#C8925A', e:'#2a2016' },
  };
  let bgActiveLayer = 1;
  let currentBgTier = null;
  function setPhaseBackground(tier){
    if(tier === currentBgTier) return;
    currentBgTier = tier;
    const { c, e } = BG_TIERS[tier];
    const gradient = `radial-gradient(120% 140% at 50% 0%, ${c} 0%, ${e} 70%)`;
    const nextIdx = bgActiveLayer === 1 ? 2 : 1;
    const nextEl = document.getElementById('bg-layer-'+nextIdx);
    const curEl = document.getElementById('bg-layer-'+bgActiveLayer);
    nextEl.style.background = gradient;
    requestAnimationFrame(()=>{
      nextEl.style.opacity = '1';
      curEl.style.opacity = '0';
    });
    bgActiveLayer = nextIdx;
  }

  function freshState(){
    return {
      screen:'intro',
      starter:null,
      steps:[],
      stepIndex:0,
      people:{
        A:{ name:'', color: PALETTE[0] },
        B:{ name:'', color: PALETTE[1] },
      },
      // per-step transient state
      timeLeft:0,
      timerId:null,
      confirmChoice:null,
    };
  }

  let state = freshState();

  function personName(id){ return (state.people[id].name||'').trim() || id; }
  function personColor(id){ return state.people[id].color; }
  function ptag(id){ return `<span class="ptag" style="background:${personColor(id)}"></span>${personName(id)}`; }

  function otherOf(p){ return p==='A' ? 'B' : 'A'; }

  function buildSteps(starter){
    const other = otherOf(starter);
    return [
      { type:'you', speaker:starter, listener:other },
      { type:'you', speaker:other,   listener:starter },
      { type:'i',   speaker:other,   listener:starter },
      { type:'i',   speaker:starter, listener:other },
      { type:'we' },
    ];
  }

  function fmt(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return String(m).padStart(1,'0') + ':' + String(s).padStart(2,'0');
  }

  function clearTimer(){
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  }

  function render(){
    app.innerHTML = '';
    clearTimer();
    const el = SCREENS[state.screen]();
    app.appendChild(el);
  }

  function el(tag, attrs, children){
    const node = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') node.className = attrs[k];
      else if(k==='html') node.innerHTML = attrs[k];
      else if(k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=> node.appendChild(c));
    return node;
  }
  function text(tag, cls, str){ return el(tag, cls?{class:cls}:null, [document.createTextNode(str)]); }

  function phaseDots(currentKey){
    const order = ['you','i','we'];
    const wrap = el('div',{class:'dots'});
    order.forEach(k=>{
      const d = el('div',{class:'dot'+(k===currentKey?' active':'')});
      d.style.background = k===currentKey ? PHASE[k].color : 'var(--line)';
      wrap.appendChild(d);
    });
    return wrap;
  }

  function ring(phaseKey, totalSec, onDone, opts){
    opts = opts||{};
    const ringColor = opts.color || PHASE[phaseKey].color;
    const size = 240, r = 104, c = 2*Math.PI*r;
    const wrap = el('div',{class:'ring-wrap'});
    wrap.style.color = ringColor;
    wrap.innerHTML = `
      <svg viewBox="0 0 ${size} ${size}">
        <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
        <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
          stroke="${ringColor}"
          stroke-dasharray="${c}" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-time"></div>
        <div class="ring-label">${opts.label||''}</div>
      </div>
    `;
    const fg = wrap.querySelector('.ring-fg');
    const timeEl = wrap.querySelector('.ring-time');
    state.timeLeft = totalSec;
    timeEl.textContent = fmt(state.timeLeft);

    function tick(){
      const frac = state.timeLeft / totalSec;
      fg.style.strokeDashoffset = String(c * (1-frac));
      timeEl.textContent = fmt(state.timeLeft);
      if(state.timeLeft <= 0){
        clearTimer();
        wrap.classList.add('pulse');
        setTimeout(onDone, 1300);
        return;
      }
      state.timeLeft -= 1;
    }
    tick();
    state.timerId = setInterval(tick, 1000);
    return wrap;
  }

  const SCREENS = {

    intro(){
      setPhaseBackground('you');
      const card = el('div',{class:'card'});
      const hero = el('div',{class:'hero'});
      hero.innerHTML = `<img src="data:image/jpeg;base64,${HOUSE_IMG}" alt="">`;
      const caption = el('div',{class:'hero-caption'});
      caption.innerHTML = `<h1>如果我們是一間好房子</h1>`;
      hero.appendChild(caption);
      card.appendChild(hero);
      card.appendChild(text('p','lede','我和你，都能在裡面找到屬於自己的角落。常常我們太急著變成「我們」，把「我」和「你」都吃掉了——最後，反而沒有人想留在這個我們裡面。'));
      card.appendChild(text('div','tagline','聽見你　→　說出我　→　走進我們'));
      const box = el('div',{class:'prompt-box'});
      box.appendChild(text('div','sub-label','大約需要 8–10 分鐘'));
      box.appendChild(text('div','example','如果剛剛已經吵過一場，這裡不用再解決什麼，先把彼此重新聽見就好。'));
      card.appendChild(box);
      card.appendChild(el('button',{class:'btn primary', onclick:()=>{ state.screen='setup'; render(); }},[document.createTextNode('開始')]));
      return card;
    },

    setup(){
      setPhaseBackground('you');
      const card = el('div',{class:'card'});
      card.appendChild(text('h1','title serif','認識你們兩位'));
      card.appendChild(text('p','lede','幫自己選一個顏色、填上名字，等一下畫面會用它認出你。'));

      const startBtns = {};

      ['A','B'].forEach(id=>{
        const box = el('div',{class:'setup-card'});
        box.appendChild(text('div','setup-row-label', id === 'A' ? '第一位' : '第二位'));
        const input = el('input',{class:'name-input', type:'text', placeholder:id, maxlength:'8'});
        input.value = state.people[id].name;
        input.addEventListener('input', ()=>{
          state.people[id].name = input.value;
          if(startBtns[id]) startBtns[id].textContent = personName(id);
        });
        box.appendChild(input);

        const swRow = el('div',{class:'swatch-row'});
        PALETTE.forEach(c=>{
          const sw = el('div',{class:'swatch'+(state.people[id].color===c?' selected':'')});
          sw.style.background = c;
          sw.addEventListener('click', ()=>{
            state.people[id].color = c;
            swRow.querySelectorAll('.swatch').forEach(n=> n.classList.remove('selected'));
            sw.classList.add('selected');
          });
          swRow.appendChild(sw);
        });
        box.appendChild(swRow);
        card.appendChild(box);
      });

      card.appendChild(text('p','lede','今天，誰先開始？'));
      const row = el('div',{class:'who-row'});
      ['A','B'].forEach(p=>{
        const btn = el('button',{class:'who-btn', onclick:()=>{
          state.starter = p;
          state.steps = buildSteps(p);
          state.stepIndex = 0;
          state.screen = 'stepRouter';
          render();
        }},[document.createTextNode(personName(p))]);
        startBtns[p] = btn;
        row.appendChild(btn);
      });
      card.appendChild(row);
      return card;
    },

    stepRouter(){
      const step = state.steps[state.stepIndex];
      if(!step){ state.screen='end'; return SCREENS.end(); }
      if(step.type==='you') return SCREENS.you_timer(step);
      if(step.type==='i') return SCREENS.i_timer(step);
      if(step.type==='we') return SCREENS.we_timer(step);
    },

    you_timer(step){
      // step.speaker = 現在說話、試著說出對方心情的人（reflecter）
      // step.listener = 心情被說的人（target），等一下負責確認有沒有被說中
      setPhaseBackground('you');
      const card = el('div',{class:'card'});
      card.appendChild(phaseDots('you'));
      const roleLine = el('div',{class:'role-line'});
      roleLine.innerHTML = `<span class="who">${ptag(step.speaker)} 說</span><span class="task">${personName(step.listener)}，你只需要，讓自己被說中的感覺進來就好</span>`;
      card.appendChild(roleLine);
      const box = el('div',{class:'prompt-box'});
      box.appendChild(el('div',{class:'example'},[document.createTextNode('我聽見，你在乎的是……')]));
      box.appendChild(el('div',{class:'example'},[document.createTextNode('我聽見，你最不希望發生的是……')]));
      card.appendChild(box);
      const goNext = ()=>{ state.screen='you_confirm'; render(); };
      card.appendChild(ring('you', PHASE.you.duration, goNext, {label:'聽見你', color: personColor(step.speaker)}));
      card.appendChild(el('button',{class:'btn primary', onclick: goNext},[document.createTextNode('說完了')]));
      state._currentStep = step;
      return card;
    },

    you_confirm(){
      setPhaseBackground('you');
      const step = state._currentStep;
      const card = el('div',{class:'card'});
      card.appendChild(phaseDots('you'));
      const roleLine = el('div',{class:'role-line'});
      roleLine.innerHTML = `<span class="who">${ptag(step.listener)}</span><span class="task">你感覺</span>`;
      card.appendChild(roleLine);
      const row = el('div',{class:'btn-row'});
      row.appendChild(el('button',{class:'btn primary', onclick:()=> advance()},[document.createTextNode('有被聽見')]));
      row.appendChild(el('button',{class:'btn', onclick:()=>{ state.screen='you_extra'; render(); }},[document.createTextNode('還有一點想補充')]));
      card.appendChild(row);
      return card;
    },

    you_extra(){
      setPhaseBackground('you');
      const step = state._currentStep;
      const card = el('div',{class:'card'});
      card.appendChild(phaseDots('you'));
      const roleLine = el('div',{class:'role-line'});
      roleLine.innerHTML = `<span class="who">${ptag(step.listener)}，請補充</span><span class="task">${personName(step.speaker)}，繼續聽就好</span>`;
      card.appendChild(roleLine);
      card.appendChild(el('button',{class:'btn primary', onclick:()=> advance()},[document.createTextNode('補充好了，繼續')]));
      return card;
    },

    i_timer(step){
      setPhaseBackground('i');
      const card = el('div',{class:'card'});
      card.appendChild(phaseDots('i'));
      const roleLine = el('div',{class:'role-line'});
      roleLine.innerHTML = `<span class="who">${ptag(step.speaker)} 說自己的需要</span><span class="task">${personName(step.listener)}，只需要聽，不用回應</span>`;
      card.appendChild(roleLine);

      const need = el('div',{class:'need-block'});
      const n1 = el('div',{class:'need-item'});
      n1.innerHTML = `<div class="k">我需要我自己……</div><div class="v">例如：在害怕的時候，不要立刻關起來。</div>`;
      const n2 = el('div',{class:'need-item'});
      n2.innerHTML = `<div class="k">我需要你……</div><div class="v">例如：先陪我一下，不要急著解決。</div>`;
      need.appendChild(n1); need.appendChild(n2);
      card.appendChild(need);

      card.appendChild(ring('i', PHASE.i.duration, ()=> advance(), {label:'說出我的需要', color: personColor(step.speaker)}));
      card.appendChild(el('button',{class:'btn primary', onclick:()=> advance()},[document.createTextNode('我說完了')]));
      return card;
    },

    we_timer(){
      setPhaseBackground('we');
      const card = el('div',{class:'card'});
      card.appendChild(phaseDots('we'));
      card.appendChild(text('h1','title serif','現在，我們'));
      card.appendChild(text('p','lede','一起看看：現在，我們可以一起做的事，或是這次練習你想帶回生活的是什麼？'));
      card.appendChild(ring('we', PHASE.we.duration, ()=>{ state.screen='end'; render(); }, {label:'我們'}));
      card.appendChild(text('p','listen-note','不用輪流，來來回回說都可以。'));
      card.appendChild(el('button',{class:'btn primary', onclick:()=>{ state.screen='end'; render(); }},[document.createTextNode('我們說完了')]));
      return card;
    },

    end(){
      setPhaseBackground('we');
      const card = el('div',{class:'card'});
      card.appendChild(text('h1','title serif','謝謝彼此，願意停下來聽'));
      card.appendChild(text('p','lede','這段時間，你們練習的不是誰對誰錯，而是先聽見，再說出來，最後一起往前走一小步。'));
      card.appendChild(el('button',{class:'btn primary', onclick:()=>{ state = freshState(); render(); }},[document.createTextNode('回到開始')]));
      return card;
    },
  };

  function advance(){
    state.stepIndex += 1;
    state.screen = 'stepRouter';
    render();
  }

  render();
})();
</script>
</body>
</html>
