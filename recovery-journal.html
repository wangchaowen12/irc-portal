<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六個月復原旅程｜IRC</title>
<meta name="description" content="陪你走過重大失落後的六個月：自由書寫、預先覺察、救援箱與支持網絡。不用註冊，資料只留在你的裝置上。">
<link rel="canonical" href="https://wangchaowen12.github.io/irc-portal/recovery-journal.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IRC｜Inner Reality Circle">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="六個月復原旅程｜IRC">
<meta property="og:description" content="陪你走過重大失落後的六個月：自由書寫、預先覺察、救援箱與支持網絡。不用註冊，資料只留在你的裝置上。">
<meta property="og:url" content="https://wangchaowen12.github.io/irc-portal/recovery-journal.html">
<meta property="og:image" content="https://wangchaowen12.github.io/irc-portal/og-home.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F0E6;
    --paper-raised:#FBF9F3;
    --ink:#2E3430;
    --ink-soft:#6B6F66;
    --moss:#5C6B52;
    --moss-deep:#404B3A;
    --clay:#B4707A;
    --clay-soft:#E9D3D3;
    --line:#DDD8C8;
    --radius:10px;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:0 20px 80px;}
  header.top{
    padding:28px 0 14px;
    position:sticky;top:0;background:var(--paper);z-index:5;
  }
  header.top h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 4px;
    color:var(--moss-deep);
  }
  header.top .sub{
    font-size:0.88rem;color:var(--ink-soft);margin:0 0 16px;
  }
  nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);}
  nav.tabs button{
    background:none;border:none;font-family:var(--sans);font-size:0.95rem;
    padding:9px 4px;margin-right:14px;color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;transition:color .15s, border-color .15s;
  }
  nav.tabs button.active{color:var(--moss-deep);border-bottom-color:var(--moss);font-weight:500;}
  nav.tabs button:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}

  section.view{display:none;padding-top:22px;}
  section.view.active{display:block;}

  h2.day-title{font-family:var(--serif);font-size:1.15rem;margin:0 0 2px;color:var(--ink);}
  .day-meta{font-size:0.82rem;color:var(--ink-soft);margin:0 0 20px;}

  .block{margin-bottom:26px;}
  .block > label.block-label{
    display:block;font-size:0.9rem;color:var(--moss-deep);font-weight:500;margin-bottom:8px;
  }
  .hint{font-size:0.8rem;color:var(--ink-soft);margin:-4px 0 10px;}

  textarea, input[type=text], input[type=date]{
    width:100%;font-family:var(--sans);font-size:0.95rem;color:var(--ink);
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;resize:vertical;
  }
  textarea:focus, input:focus{outline:2px solid var(--moss);outline-offset:1px;}
  textarea.freewrite{min-height:120px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:var(--sans);font-size:0.86rem;
    background:var(--paper-raised);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:999px;padding:6px 13px;cursor:pointer;transition:.15s;
  }
  .chip.active{background:var(--moss);border-color:var(--moss);color:#fff;}
  .chip.special-active{background:var(--clay);border-color:var(--clay);color:#fff;}
  .chip.add-chip{border-style:dashed;color:var(--moss-deep);}

  .add-inline{display:none;gap:6px;margin-top:8px;}
  .add-inline.show{display:flex;}
  .add-inline input{flex:1;}
  .add-inline button{
    font-family:var(--sans);font-size:0.85rem;background:var(--moss);color:#fff;
    border:none;border-radius:var(--radius);padding:0 14px;cursor:pointer;
  }

  .quad{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:520px){.quad{grid-template-columns:1fr 1fr;}}
  .quad-cat h3{
    font-size:0.88rem;font-weight:500;margin:0 0 8px;color:var(--moss-deep);
  }

  .special-toggle{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;
    font-size:0.9rem;color:var(--ink);
  }
  .special-toggle input{width:16px;height:16px;}
  .special-fields{display:none;border-left:2px solid var(--clay-soft);padding-left:14px;margin-top:10px;}
  .special-fields.show{display:block;}
  .special-fields .f{margin-bottom:10px;}
  .special-fields .f label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:4px;}

  .tomorrow-toggle{
    background:none;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 14px;width:100%;text-align:left;font-family:var(--sans);
    font-size:0.9rem;color:var(--moss-deep);cursor:pointer;margin-top:6px;
  }
  #tomorrow-panel{margin-top:14px;display:none;}
  #tomorrow-panel.show{display:block;}

  /* Calendar */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--moss-deep);font-size:1rem;}
  .cal-nav .label{font-family:var(--serif);font-size:1.05rem;color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:0.72rem;color:var(--ink-soft);padding-bottom:4px;}
  .cal-cell{
    position:relative;aspect-ratio:1;border-radius:8px;border:1px solid transparent;
    display:flex;align-items:center;justify-content:center;font-size:0.88rem;
    cursor:pointer;background:var(--paper-raised);color:var(--ink);
  }
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell.today{border-color:var(--moss);font-weight:600;}
  .cal-cell:hover{background:var(--clay-soft);}
  .cal-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--moss);}
  .cal-cell.has-special .cal-dot{background:var(--clay);}
  .cal-legend{display:flex;gap:16px;margin-top:16px;font-size:0.8rem;color:var(--ink-soft);}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend i{width:6px;height:6px;border-radius:50%;display:inline-block;}

  /* Modal */
  #modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(46,52,48,.4);
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20;
  }
  #modal-overlay.show{display:flex;}
  #modal-box{background:var(--paper);border-radius:14px;padding:26px 22px;max-width:560px;width:100%;position:relative;}
  #modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.3rem;color:var(--ink-soft);cursor:pointer;}

  /* Settings */
  .settings-group{margin-bottom:30px;}
  .settings-group h3{font-family:var(--serif);font-size:1rem;color:var(--moss-deep);margin:0 0 10px;}
  .list-edit{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .list-edit .chip{padding-right:8px;}
  .list-edit .chip .x{margin-left:6px;color:inherit;opacity:.7;}
  .rescue-intro{font-size:0.86rem;color:var(--ink-soft);margin:-6px 0 18px;}
  .rf-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:12px;
  }
  .rf-card .rf-num{font-size:0.78rem;color:var(--moss-deep);margin-bottom:8px;}
  .rf-card .rf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .rf-card .rf-grid input{width:100%;}
  .rf-card .rf-help{margin-top:8px;}
  .rf-card label.mini{display:block;font-size:0.76rem;color:var(--ink-soft);margin-bottom:3px;}

  .contact-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .contact-row input{flex:1;}
  .contact-row .rm{
    background:none;border:none;color:var(--clay);font-size:1.1rem;cursor:pointer;padding:0 4px;
  }

  .danger{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);}
  .danger button{
    background:none;border:1px solid var(--clay);color:var(--clay);border-radius:var(--radius);
    padding:8px 14px;font-size:0.85rem;cursor:pointer;
  }

  /* Onboarding */
  #onboarding-overlay{
    display:none;position:fixed;inset:0;background:var(--paper);z-index:30;
    align-items:center;justify-content:center;padding:24px;
  }
  #onboarding-overlay.show{display:flex;}
  #onboarding-box{max-width:460px;width:100%;}
  #onboarding-box h1{font-family:var(--serif);font-size:1.4rem;color:var(--moss-deep);margin:0 0 6px;}
  #onboarding-box p.intro{color:var(--ink-soft);font-size:0.92rem;margin:0 0 24px;}
  #onboarding-box .field{margin-bottom:18px;}
  #onboarding-box label{display:block;font-size:0.88rem;margin-bottom:6px;color:var(--ink);}
  #onboarding-box button.start{
    background:var(--moss);color:#fff;border:none;border-radius:var(--radius);
    padding:11px 22px;font-size:0.95rem;cursor:pointer;margin-top:8px;
  }
  .urgent-box{border:1px solid var(--clay);background:#F6E9E9;border-radius:var(--radius);padding:12px 14px;margin-top:10px;font-size:0.88rem;line-height:1.75;}
  .urgent-box b{color:#8A4A54;}
  .soft-prompt{border:1px solid var(--moss);background:var(--paper-raised);border-radius:var(--radius);padding:10px 14px;margin-top:10px;font-size:0.88rem;}
  .link-btn{background:none;border:none;color:var(--moss-deep);font-family:var(--sans);font-size:0.82rem;text-decoration:underline;cursor:pointer;padding:6px 0;margin-top:4px;}
  .soft-prompt .link-btn{font-size:0.88rem;margin:0 0 0 6px;padding:0;}
  .task-mgr{margin-top:8px;padding:12px;border:1px dashed var(--line);border-radius:var(--radius);}
  .task-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .task-row input[type=text]{flex:1 1 100%;}
  .task-row select{font-family:var(--sans);font-size:0.82rem;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper-raised);color:var(--ink);}
  .task-row input.to{flex:1 1 150px;width:auto;}
  .rm-x{background:none;border:none;color:var(--clay);font-size:1.1rem;cursor:pointer;padding:0 4px;margin-left:auto;}
  .map-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .map-row .txt{flex:1;font-size:0.9rem;}
  .toggle-mini{font-family:var(--sans);font-size:0.78rem;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-soft);border-radius:999px;padding:3px 10px;cursor:pointer;}
  .toggle-mini.on-trigger{background:var(--moss);border-color:var(--moss);color:#fff;}
  .toggle-mini.on-avoid{background:var(--clay);border-color:var(--clay);color:#fff;}
  .j-quote{font-family:var(--serif);color:var(--ink-soft);font-size:0.9rem;margin:0 0 4px;}
  .j-month{font-family:var(--serif);font-size:0.95rem;color:var(--moss-deep);margin:30px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .j-entry{padding:16px 0;border-bottom:1px solid var(--line);}
  .j-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .j-date{font-family:var(--serif);font-size:1rem;font-weight:500;}
  .j-tag{font-size:0.72rem;background:var(--clay-soft);color:#8A4A54;border-radius:999px;padding:1px 9px;}
  .j-head .link-btn{margin:0 0 0 auto;padding:0;}
  .j-text{margin:0 0 8px;white-space:pre-wrap;font-size:0.95rem;}
  .j-line{display:flex;gap:10px;font-size:0.84rem;line-height:1.7;}
  .j-k{flex:0 0 4.8em;color:var(--ink-soft);}
  .j-v{flex:1;}
  .j-plan{margin-top:8px;padding-left:12px;border-left:2px solid var(--clay-soft);}
  .j-empty{color:var(--ink-soft);font-size:0.9rem;padding:20px 0;}
  .j-tools{display:flex;justify-content:flex-end;margin-top:-4px;}
  @media print{
    header.top,.no-print,#modal-overlay{display:none !important;}
    body{background:#fff;}
    #app{max-width:none;padding:0;}
    .j-entry{break-inside:avoid;}
  }
  .sup-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;}
  .sup-row .chip{font-size:0.78rem;padding:4px 10px;}
  .sel-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tog-row{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 20px;}
  .tog{font-family:var(--sans);font-size:0.85rem;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:6px 14px;cursor:pointer;}
  .tog.open{border-color:var(--moss);color:var(--moss-deep);background:var(--paper-raised);font-weight:500;}
  details.fold{border-bottom:1px solid var(--line);}
  details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:15px 0;font-family:var(--serif);font-size:1rem;color:var(--moss-deep);}
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary::after{content:"＋";margin-left:auto;color:var(--ink-soft);font-family:var(--sans);font-size:0.9rem;}
  details.fold[open] > summary::after{content:"－";}
  details.fold .badge{font-family:var(--sans);font-size:0.74rem;color:var(--ink-soft);background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;padding:0 8px;}
  details.fold > .fold-body{padding:0 0 18px;}
  .foot{margin-top:48px;font-size:0.78rem;color:var(--ink-soft);}
  .foot a{color:var(--moss-deep);}
</style>
</head>
<body>

<div id="onboarding-overlay">
  <div id="onboarding-box">
    <h1>我的復原旅程</h1>
    <p class="intro">先寫下起點，不是為了被評估。</p>
    <div class="field">
      <label for="ob-what">我發生了什麼事？</label>
      <textarea id="ob-what" rows="3" placeholder="例如：我的一段重要關係結束了。"></textarea>
    </div>
    <div class="field">
      <label for="ob-start">我想從哪一天開始這段旅程？</label>
      <input type="date" id="ob-start">
    </div>
    <button class="start" id="ob-submit">開始</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>我的復原旅程</h1>
    <p class="sub">我可以按照自己的速度復原。</p>
    <nav class="tabs">
      <button data-view="today" class="active">今天</button>
      <button data-view="journal">日誌</button>
      <button data-view="calendar">月曆</button>
      <button data-view="resources">資源包</button>
      <button data-view="settings">設定</button>
    </nav>
  </header>

  <section class="view active" id="view-today"></section>
  <section class="view" id="view-journal"></section>
  <section class="view" id="view-calendar"></section>
  <section class="view" id="view-resources"></section>
  <section class="view" id="view-settings"></section>

  <p class="foot no-print">這個小工具，來自 <a href="https://wangchaowen12.github.io/irc-portal/">IRC｜Inner Reality Circle</a>。內容只存在這台裝置的瀏覽器裡。</p>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close" aria-label="關閉">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "rj_data_v1";
  var CATS = [
    {key:"need", title:"要處理"},
    {key:"want", title:"想做"},
    {key:"care", title:"照顧自己"},
    {key:"connect", title:"連結"}
  ];

  var URGENT = "有傷害自己的念頭";
  var SUPPORT_SUGGEST = ["聽我說，不用給建議","給我空間來表達我的感覺","陪我散步","陪我吃飯","陪著我，不用說話","提醒我吃飯睡覺","接我的電話","幫我處理一件事","傳訊息關心我"];
  function supportList(person){ return (person.helpWith || "").split("、").map(function(x){ return x.trim(); }).filter(Boolean); }
  function uid(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function taskById(id){ return data.tasks.filter(function(t){ return t.id===id; })[0]; }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseYMD(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function todayStr(){ return fmt(new Date()); }
  function addDays(dateStr, n){ var d=parseYMD(dateStr); d.setDate(d.getDate()+n); return fmt(d); }
  function niceDate(dateStr){
    var d=parseYMD(dateStr);
    var w=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
    return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+w;
  }

  function defaultData(){
    return {
      meta:{ whatHappened:"", startDate: todayStr() },
      map:["紀念日","以前的照片","一個人的時候","社群媒體","某些歌曲","某個地方"].map(function(t){ return {text:t, trigger:true, avoid:false}; }),
      tasks:[{id:"t_seed", text:"處理一些文件或行政事項", when:"now", who:"self", to:""}],
      warnSigns:[],
      options:{
        want:["做一件我一直想做的事"],
        care:["好好吃一餐、好好睡一覺"],
        connect:["傳個訊息給一個朋友"]
      },
      days:{},
      rescueFive:[0,1,2,3,4].map(function(){ return {name:"",relation:"",contact:"",helpWith:""}; }),
      rescueKit:{ peopleSelected:[false,false,false,false,false], places:[], things:[], professional:[] },
      supportMessage:"",
      supportMsgs:{}
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  var data = load();
  var hasOnboarded = !!data;
  if(!data) data = defaultData();
  if(!data.rescueFive) data.rescueFive = [0,1,2,3,4].map(function(){ return {name:"",relation:"",contact:"",helpWith:""}; });
  if(!data.rescueKit) data.rescueKit = { peopleSelected:[false,false,false,false,false], places:[], things:[], professional:[] };
  if(!data.rescueKit.peopleSelected) data.rescueKit.peopleSelected = [false,false,false,false,false];
  if(typeof data.supportMessage !== "string") data.supportMessage = "";
  if(!data.supportMsgs){
    data.supportMsgs = {};
    var OLD_MSG = "嗨，想先讓你知道——我最近正在經歷一段比較困難的復原期。如果有一天我真的撐不住了，可能會需要你的支持。到時候如果我聯絡你，希望你知道這不是無緣無故，也謝謝你先看到這段話。";
    if(data.supportMessage && data.supportMessage !== OLD_MSG) data.supportMsgs.g = data.supportMessage;
  }
  if(!data.map){
    data.map = (data.triggerList || []).map(function(t){ return {text:t, trigger:true, avoid:false}; });
    delete data.triggerList;
  }
  if(!data.tasks){
    var oldNeed = (data.options && data.options.need) || [];
    data.tasks = oldNeed.map(function(t){ return {id:uid(), text:t, when:"now", who:"self", to:""}; });
    Object.keys(data.days || {}).forEach(function(k){
      var d = data.days[k];
      if(d.selected && d.selected.need){
        d.selected.need = d.selected.need.map(function(sx){
          var m = data.tasks.filter(function(t){ return t.text===sx; })[0];
          if(!m){ m = {id:uid(), text:sx, when:"now", who:"self", to:""}; data.tasks.push(m); }
          return m.id;
        });
      }
    });
    if(data.options) delete data.options.need;
  }
  if(!data.warnSigns) data.warnSigns = [];

  function ensureDay(dateStr){
    if(!data.days[dateStr]){
      data.days[dateStr] = {
        freewrite:"", triggers:[], selected:{need:[],want:[],care:[],connect:[]},
        special:false, plan:{where:"",what:"",who:"",contact:"",help:""}, warnings:[]
      };
    }
    if(!data.days[dateStr].warnings) data.days[dateStr].warnings = [];
    return data.days[dateStr];
  }
  function dayHasContent(day){
    if(!day) return false;
    if(day.freewrite && day.freewrite.trim()) return true;
    if(day.triggers && day.triggers.length) return true;
    if(day.warnings && day.warnings.length) return true;
    var s=day.selected||{};
    for(var k in s){ if(s[k] && s[k].length) return true; }
    return false;
  }

  // ---------- chip list builder ----------
  function buildChipRow(container, allItems, checkedItems, onToggle, addLabel, onAdd, styleClass, labelFn){
    container.innerHTML = "";

      chip.textContent = labelFn ? labelFn(item) : item;

      row.appendChild(chip);
    });
    var addChip = document.createElement("button");
    addChip.type = "button";
    addChip.className = "chip add-chip";
    addChip.textContent = "+ " + addLabel;
    row.appendChild(addChip);
    container.appendChild(row);

    var inlineWrap = document.createElement("div");
    inlineWrap.className = "add-inline";
    var inlineInput = document.createElement("input");
    inlineInput.type = "text";
    inlineInput.placeholder = "輸入內容";
    var inlineBtn = document.createElement("button");
    inlineBtn.type = "button";
    inlineBtn.textContent = "新增";
    inlineWrap.appendChild(inlineInput);
    inlineWrap.appendChild(inlineBtn);
    container.appendChild(inlineWrap);

    addChip.addEventListener("click", function(){
      inlineWrap.classList.toggle("show");
      if(inlineWrap.classList.contains("show")) inlineInput.focus();
    });
    function commit(){
      var v = inlineInput.value.trim();
      if(v){ onAdd(v); inlineInput.value=""; inlineWrap.classList.remove("show"); }
    }
    inlineBtn.addEventListener("click", commit);
    inlineInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });

  // ---------- Journal view (read-only, concise) ----------
  function shortDate(ds){
    var d = parseYMD(ds);
    return (d.getMonth()+1) + "月" + d.getDate() + "日 " + ["週日","週一","週二","週三","週四","週五","週六"][d.getDay()];

  function taskLabel(id){
    var t = taskById(id);
    if(!t) return null;
    return t.text + (t.who==="delegate" ? "（委託" + (t.to ? " " + t.to : "") + "）" : "");

  function hasJournalContent(day){ return dayHasContent(day) || !!day.special; }
  function buildEntry(ds, day){
    var art = document.createElement("article"); art.className = "j-entry";
    var head = document.createElement("div"); head.className = "j-head";
    var dt = document.createElement("span"); dt.className = "j-date"; dt.textContent = shortDate(ds);
    head.appendChild(dt);
    if(day.special){ var tag = document.createElement("span"); tag.className = "j-tag"; tag.textContent = "特別日"; head.appendChild(tag); }
    var eb = document.createElement("button"); eb.type = "button"; eb.className = "link-btn no-print"; eb.textContent = "編輯";
    eb.addEventListener("click", function(){ openModal(ds); });
    head.appendChild(eb);
    art.appendChild(head);
    if(day.freewrite && day.freewrite.trim()){
      var tx = document.createElement("p"); tx.className = "j-text"; tx.textContent = day.freewrite.trim(); art.appendChild(tx);
    }
    function line(parent, k, v){
      var r = document.createElement("div"); r.className = "j-line";
      var kk = document.createElement("span"); kk.className = "j-k"; kk.textContent = k;
      var vv = document.createElement("span"); vv.className = "j-v"; vv.textContent = v;
      r.appendChild(kk); r.appendChild(vv); parent.appendChild(r);
    }
    var sel = day.selected || {};
    if(day.triggers && day.triggers.length) line(art, "觸發", day.triggers.join("、"));
    if(day.warnings && day.warnings.length) line(art, "警訊", day.warnings.join("、"));
    var need = (sel.need || []).map(taskLabel).filter(Boolean);
    if(need.length) line(art, "需要處理", need.join("、"));
    if(sel.want && sel.want.length) line(art, "想做", sel.want.join("、"));
    if(sel.care && sel.care.length) line(art, "照顧自己", sel.care.join("、"));
    if(sel.connect && sel.connect.length) line(art, "與人連結", sel.connect.join("、"));
    if(day.special){
      var pl = day.plan || {};
      var rows = [["where","地點"],["what","要做"],["who","陪伴"],["contact","可聯絡"],["help","幫助我的"]].filter(function(x){ return pl[x[0]] && pl[x[0]].trim(); });
      if(rows.length){
        var box = document.createElement("div"); box.className = "j-plan";
        rows.forEach(function(x){ line(box, x[1], pl[x[0]].trim()); });
        art.appendChild(box);
      }
    }
    return art;
  }
  function renderJournal(){
    var mount = document.getElementById("view-journal");
    mount.innerHTML = "";
    var t = todayStr();
    var keys = Object.keys(data.days).filter(function(k){ return hasJournalContent(data.days[k]); }).sort();
    var future = keys.filter(function(k){ return k > t; });
    var past = keys.filter(function(k){ return k <= t; }).reverse();

    var h = document.createElement("h2"); h.className = "day-title"; h.textContent = "我的日誌";
    mount.appendChild(h);
    var meta = document.createElement("p"); meta.className = "day-meta";
    var written = past.filter(function(k){ return dayHasContent(data.days[k]); }).length;
    var sd = data.meta.startDate ? parseYMD(data.meta.startDate) : null;

  // ---------- fold groups into collapsible sections ----------
  function foldify(mount, countFn){
    var folds = [];
    Array.prototype.slice.call(mount.querySelectorAll(".settings-group")).forEach(function(g){
      var h = g.querySelector("h3");
      if(!h || g.dataset.nofold) return;
      var title = h.textContent;
      var det = document.createElement("details"); det.className = "fold";
      var sm = document.createElement("summary");
      var tt = document.createElement("span"); tt.textContent = title;
      var bd = document.createElement("span"); bd.className = "badge";
      sm.appendChild(tt); sm.appendChild(bd);
      var body = document.createElement("div"); body.className = "fold-body";
      h.parentNode.removeChild(h);
      while(g.firstChild) body.appendChild(g.firstChild);
      det.appendChild(sm); det.appendChild(body);
      g.parentNode.replaceChild(det, g);
      folds.push({title:title, bd:bd});
    });
    function upd(){
      folds.forEach(function(f){ var n = countFn(f.title); f.bd.textContent = n || ""; f.bd.style.display = n ? "inline" : "none"; });
    }
    upd();
    if(mount._foldH){ ["click","input","change","keydown"].forEach(function(ev){ mount.removeEventListener(ev, mount._foldH); }); }
    mount._foldH = function(){ setTimeout(upd, 0); };
    ["click","input","change","keydown"].forEach(function(ev){ mount.addEventListener(ev, mount._foldH); });
  }
  function resCount(title){
    if(title.indexOf("第 0 步") === 0) return data.warnSigns.length;
    if(title.indexOf("People") === 0) return data.rescueKit.peopleSelected.filter(Boolean).length;
    if(title.indexOf("Places") === 0) return data.rescueKit.places.length;
    if(title.indexOf("Things") === 0) return data.rescueKit.things.length;
    if(title === "這段時間先不要") return data.map.filter(function(m){ return m.avoid; }).length;
    if(title.indexOf("Professional") === 0) return data.rescueKit.professional.filter(function(x){ return (x.name && x.name.trim()) || (x.contact && x.contact.trim()); }).length;
    if(title === "我的救援五人小組") return data.rescueFive.filter(function(x){ return x.name && x.name.trim(); }).length;
    return 0;
  }
  function settingsCount(title){
    if(title === "觸發與界線") return data.map.length;
    for(var i = 0; i < CATS.length; i++){
      if(CATS[i].title === title) return CATS[i].key === "need" ? data.tasks.length : data.options[CATS[i].key].length;
    }
    return 0;
  }

      refresh();
    }
    simpleListBlock("Places｜可以去哪裡？", "places", "例如：某某好友家");
    simpleListBlock("Things I Can Do｜我可以做什麼？", "things", "例如：打電話給生命線");

    var gAvoid = document.createElement("div"); gAvoid.className = "settings-group";
    var hAvoid = document.createElement("h3"); hAvoid.textContent = "這段時間先不要";
    gAvoid.appendChild(hAvoid);
    var avoidItems = data.map.filter(function(m){ return m.avoid; });
    if(avoidItems.length){
      var avRow = document.createElement("div"); avRow.className = "list-edit";
      avoidItems.forEach(function(m){ var c = document.createElement("span"); c.className = "chip special-active"; c.textContent = m.text; avRow.appendChild(c); });
      gAvoid.appendChild(avRow);
    } else {
      var avEmpty = document.createElement("p"); avEmpty.className = "hint"; avEmpty.textContent = "到設定的「觸發與界線」標記想避開的事與人。";
      gAvoid.appendChild(avEmpty);
    }
    var avGo = document.createElement("button"); avGo.type = "button"; avGo.className = "link-btn"; avGo.textContent = "去編輯";
    avGo.addEventListener("click", function(){ switchView("settings"); });
    gAvoid.appendChild(avGo);
    mount.appendChild(gAvoid);

    var g3 = document.createElement("div"); g3.className="settings-group";
    var h3 = document.createElement("h3"); h3.textContent = "Professional / Emergency Support｜專業／緊急支持";
    g3.appendChild(h3);
    var profList = document.createElement("div");
    g3.appendChild(profList);
    var addProfBtn = document.createElement("button");
    addProfBtn.textContent = "+ 新增一筆";
    addProfBtn.style.cssText = "font-family:var(--sans);font-size:0.85rem;background:none;border:1px dashed var(--line);color:var(--moss-deep);border-radius:10px;padding:6px 14px;cursor:pointer;margin-top:4px;";
    addProfBtn.addEventListener("click", function(){
      data.rescueKit.professional.push({name:"",contact:""}); save(); refreshProf();
    });
    g3.appendChild(addProfBtn);
    mount.appendChild(g3);
    function refreshProf(){
      profList.innerHTML = "";
      data.rescueKit.professional.forEach(function(entry, i){
        var row = document.createElement("div"); row.className="contact-row";
        var n = document.createElement("input"); n.type="text"; n.placeholder="名稱（例如：諮商師、醫療資源）"; n.value=entry.name||"";
        n.addEventListener("input", function(){ entry.name=n.value; save(); });
        var c = document.createElement("input"); c.type="text"; c.placeholder="聯絡方式"; c.value=entry.contact||"";
        c.addEventListener("input", function(){ entry.contact=c.value; save(); });
        var rm = document.createElement("button"); rm.className="rm"; rm.textContent="×";
        rm.addEventListener("click", function(){ data.rescueKit.professional.splice(i,1); save(); refreshProf(); });
        row.appendChild(n); row.appendChild(c); row.appendChild(rm);
        profList.appendChild(row);
      });
    }
    refreshProf();

    mount.appendChild(fiveWrap);
    foldify(mount, resCount);
  }

  // ---------- tab switching ----------
  var tabs = document.querySelectorAll("nav.tabs button");
  function switchView(name){
    document.getElementById("modal-overlay").classList.remove("show");
    tabs.forEach(function(b){ b.classList.toggle("active", b.dataset.view===name); });
    document.querySelectorAll("section.view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById("view-"+name).classList.add("active");
    if(name==="today") renderToday();
    if(name==="journal") renderJournal();
    if(name==="calendar") renderCalendar();
    if(name==="resources") renderResources();
    if(name==="settings") renderSettings();
    window.scrollTo(0,0);
  }
  tabs.forEach(function(btn){
    btn.addEventListener("click", function(){ switchView(btn.dataset.view); });
  });

  // ---------- onboarding ----------
  function startApp(){
    document.getElementById("onboarding-overlay").classList.remove("show");
    renderToday();
  }
  if(!hasOnboarded){
    document.getElementById("onboarding-overlay").classList.add("show");
    document.getElementById("ob-start").value = todayStr();
    document.getElementById("ob-submit").addEventListener("click", function(){
      data.meta.whatHappened = document.getElementById("ob-what").value.trim();
      data.meta.startDate = document.getElementById("ob-start").value || todayStr();
      save();
      startApp();
    });
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
